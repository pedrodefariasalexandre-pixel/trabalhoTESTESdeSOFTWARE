name: API Tests (Karate)

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:          # botão "Run workflow" na aba Actions (útil no Plano B da demo)
    inputs:
      tags:
        description: 'Filtro de tags do Karate (ex.: @smoke). Vazio = suíte completa'
        required: false
        default: ''

permissions:
  contents: read
  checks: write               # necessário para o test-reporter publicar o resultado na aba "Checks"

concurrency:
  group: api-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-tests:
    # Roda em Linux e em Windows: garante que a suíte funciona nos dois sistemas
    # (inclusive o rodar-no-windows.cmd usado nos computadores do laboratório).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    env:
      BASE_URL: https://dummyjson.com
      # Credenciais públicas de teste da DummyJSON. Em um projeto real viriam de
      # Settings > Secrets and variables > Actions (ex.: ${{ secrets.API_PASSWORD }}).
      DUMMYJSON_USERNAME: ${{ secrets.DUMMYJSON_USERNAME || 'emilys' }}
      DUMMYJSON_PASSWORD: ${{ secrets.DUMMYJSON_PASSWORD || 'emilyspass' }}

    steps:
      - name: Checkout do código
        uses: actions/checkout@v7

      - name: Instalar Java 21 (com cache do Maven)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Executar testes de API (Linux)
        if: runner.os != 'Windows'
        env:
          TAGS: ${{ inputs.tags }}   # via variável (e não direto no script) para evitar script injection
        run: |
          if [ -n "$TAGS" ]; then
            ./mvnw -B test -Dkarate.options="--tags $TAGS"
          else
            ./mvnw -B test
          fi

      - name: Executar testes de API (Windows, pelo rodar-no-windows.cmd)
        if: runner.os == 'Windows'
        shell: cmd
        env:
          TAGS: ${{ inputs.tags }}
        run: |
          if defined TAGS (
            call rodar-no-windows.cmd -B "-Dkarate.options=--tags %TAGS%"
          ) else (
            call rodar-no-windows.cmd -B
          )

      - name: Publicar relatório HTML do Karate (artifact)
        if: always()          # publica mesmo quando algum teste falha
        uses: actions/upload-artifact@v7
        with:
          name: karate-report-${{ runner.os }}
          path: target/karate-reports/
          retention-days: 14

      - name: Resumo dos testes na aba Checks
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: Resultado Karate (${{ runner.os }})
          path: target/karate-reports/junit-xml/*.xml
          reporter: java-junit
          fail-on-error: false
